name: Build EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build EXE
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      
      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Payables-Manager-EXE
          path: dist/
